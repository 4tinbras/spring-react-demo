version: '3'
services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./monitoring/rules.yml:/etc/prometheus/rules.yml"
      - prometheus_metrics:/prometheus
    networks:
      - demo
    ports:
      - "9090:9090"
  #TODO add alertmanager
#  alertmanager:
  grafana:
    image: grafana/grafana:9.5.2
    container_name: grafana
    #   TODO: sme defined in grafana.ini gets overwritten somehow
    environment:
      GF_SERVER_HTTP_PORT: 4500
    networks:
      - demo
    ports:
      - "4500:4500"
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana-config/grafana.ini:/etc/grafana/grafana.ini
      - ./monitoring/grafana-config/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana

  kafka:
    image: apache/kafka:latest
    hostname: kafka-broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka-broker:29092,CONTROLLER://kafka-broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: spreact-demo-cluster

  backend:
    #    image: local/contacts-service
    build: ./spring-backend/.
    environment:
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - demo
    ports:
      - "8080:8080"
      - "8071:8071"

  envoy:
    image: envoyproxy/envoy:v1.31.0
    ports:
      - "10000:10000"
    volumes:
      - ./proxy/envoy_config.yml:/etc/envoy/envoy.yaml

  frontend:
    #    image: local/frontend-service
    build: ./react-front/.
    networks:
      - demo
    ports:
      - "3000:3000"

  keycloak:
    #    image: local/authz-service
    build: ./authz-store/.
    environment:
      KEYCLOAK_ADMIN: sample-admin
      KEYCLOAK_ADMIN_PASSWORD: sample-pass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8030
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_LOG_LEVEL: info
    volumes:
      - ./authz-store/kc-spreact.json:/opt/keycloak/data/import/kc-spreact.json
    networks:
      - demo
    ports:
      - "8030:8030"
      - "8020:8020"
      - "9100:9100"

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    networks:
      - demo
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: spreact

  adminer:
    image: adminer
    restart: always
    ports:
      - "8025:8080"

networks:
  demo:
    driver: bridge
volumes:
  prometheus_metrics:
  grafana-storage: