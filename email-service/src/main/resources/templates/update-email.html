<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Template for simple email message</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="'Hello ' + ${name}">
</p>

<p>We are writing to you to confirm that you have successfully updated your account.</p>

<p>
    Regards <br/>
    <em></em>
</p>
</body>
</html>
