management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: [ "health", "info", "metrics", "prometheus" ]
  server:
    port: 8041

  #    TODO: reconfigure when they return specific values as per k8s guide
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8040

services:
  email:
    file:
      folder: ./
      name: email-to-be-sent.html
    sender:
      host: localhost
      port: 7777
      protocol: smtp
      username: user
      password: password

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: spreact
  threads:
    virtual:
      enabled: true