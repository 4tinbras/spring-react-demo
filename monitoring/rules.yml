groups:
- name: HTTP requests
  rules:
     - alert: HighErrorRate
       expr: increase(http_server_requests_seconds_count{outcome!="SUCCESS", uri!~".*metrics"}[1m]) / increase(http_server_requests_seconds_count{uri!~".*metrics"}[1m]) > 0.1
       for: 5m
       keep_firing_for: 5m
       labels:
         severity: high
       annotations:
         summary: "High request error rate"
         #         templating means that it will be raised separately for each app that collects that metric
         description: "Application {{ $labels.app }} has been returning high rate of errors"

    #    as a standardised app it should never really return 500, any 500 should raise an alert
     - alert: Keycloak500Errors
       expr: increase(http_server_requests_seconds_count{status=~"5.*", app="keycloak"}[1m]) > 0
       for: 5m
       keep_firing_for: 5m
       labels:
         severity: high
       annotations:
         summary: "High request 5** error rate"
         description: "Application {{ $labels.app }} has been returning high rate of 5** errors"

    #   as a custom app there is always a scope for error, be more tolerant
     - alert: Other500Errors
       expr: increase(http_server_requests_seconds_count{status=~"5.*", app!="keycloak"}[1m]) / increase(http_server_requests_seconds_count{uri!~".*metrics"}[1m]) > 0.5
       for: 5m
       keep_firing_for: 5m
       labels:
         severity: high
       annotations:
         summary: "High request 5** error rate"
         description: "Application {{ $labels.app }} has been returning high rate of 5** errors"

     - alert: HighLatency
       expr: sum(rate(http_server_requests_seconds_sum[1m])) / sum(rate(http_server_requests_seconds_count[1m]))
       for: 5m
       keep_firing_for: 5m
       labels:
         severity: medium
       annotations:
         summary: "High response latency"
         description: "Application {{ $labels.app }} has been responding with high latency"

