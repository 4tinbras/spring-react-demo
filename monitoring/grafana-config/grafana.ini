[server]
http_port=4500

[security]
admin_user=sample-admin
admin_password=sample-pass
admin_email=admin@localhost

[database]
type = postgres
host = 127.0.0.1:5432
name = grafana
user = demo
; # If the password contains # or ; you have to wrap it with triple quotes. Ex """#password;"""
password = demo

[paths]
; # relative paths start with grafana installation location not place from which it is run; hence absolut path or manual copy is needed
permitted_provisioning_paths = devenv/dev-dashboards|conf/provisioning|<insert_absolute_path_to_your_provisioning_folder>
provisioning = <insert_absolute_path_to_your_provisioning_folder>